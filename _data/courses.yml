- id: cs193t
  code: "CS193T"
  school: "Stanford University · 斯坦福大学"
  title: "与 AI 一起思考：高效且负责任的人机协作"
  english_title: "Thinking with AI: Strategies for Effective and Ethical Human-AI Collaboration"
  note_label: "CS193T · THINKING WITH AI"
  instructor: "Cynthia Bailey"
  description: "按官网 8 讲逐讲整理：从 AI 原理、提示词与资料管理，到智能体、评估治理、成本与保持独立思考。"
  url: "/course-notes/cs193t/"
  source_url: "https://web.stanford.edu/class/archive/cs/cs193t/cs193t.1272/lectures/"
  source_domain: "web.stanford.edu"
  lessons:
    - number: 1
      title: "AI 导论：模型、上下文与能力边界"
      url: "/course-notes/cs193t-lecture-01/"
      description: "理解 token、神经网络、权重、训练与推理，建立注意力和上下文窗口的直觉，辨析幻觉、迎合与拟人化。"
    - number: 2
      title: "核心提示技巧：把目标、证据与验收写清楚"
      url: "/course-notes/cs193t-lecture-02/"
      description: "任务说明书、访谈式提示、提示复盘；用证据提升可观察性，管理长对话、上下文腐化与资源消耗。"
    - number: 3
      title: "资料与记忆管理：RAG、可复用指令与提示注入"
      url: "/course-notes/cs193t-lecture-03/"
      description: "区分当前上下文、跨会话记忆和模型训练，理解检索增强生成、来源冲突、策略性保留信息与不可信材料。"
    - number: 4
      title: "跨学科嘉宾讨论：AI 如何进入真实研究"
      url: "/course-notes/cs193t-lecture-04/"
      description: "依据官方嘉宾介绍梳理文学、法律与生物工程三种研究视角，并用明确标注的补充案例练习证据、责任与专业能力分析。"
    - number: 5
      title: "让 AI 行动：连接器、智能体循环与权限"
      url: "/course-notes/cs193t-lecture-05/"
      description: "连接器和工具调用怎样工作；智能体七要素、分析—行动—观察循环、大象与金鱼工作流，以及最小权限和可逆性。"
    - number: 6
      title: "控制你的 AI：编程协作、持续监测与评估"
      url: "/course-notes/cs193t-lecture-06/"
      description: "准备—生成—审查三步法，部署后的分布变化与幸存者偏差，NIST 风险框架、数据责任和可信评估。"
    - number: 7
      title: "算清成本：token、缓存、模型选择与 API 密钥"
      url: "/course-notes/cs193t-lecture-07/"
      description: "读懂用量报告，区分输入、输出与缓存费用；结合串行延迟和通过率选模型，识别密钥泄漏与环境成本的估算边界。"
    - number: 8
      title: "保持敏锐：学习迁移、独立判断与 AI 使用披露"
      url: "/course-notes/cs193t-lecture-08/"
      description: "从布鲁姆分类与有效挣扎理解学习，用依赖日志和不委托区域防止技能退化，并写出具体、可负责的 AI 使用说明。"
- id: post-training
  code: "LLM POST-TRAINING"
  school: "DeepLearning.AI · University of Washington · NexusFlow"
  title: "大语言模型的后训练"
  english_title: "Post-training of LLMs"
  instructor: "Banghua Zhu（朱邦华）"
  description: "7 讲完整中文笔记：从监督微调 SFT、偏好优化 DPO 到 PPO / GRPO，串起原理、数据、训练代码与评估方法。"
  url: "/course-notes/post-training/"
  source_url: "https://learn.deeplearning.ai/courses/post-training-of-llms/lesson/n25bz/introduction"
  source_domain: "learn.deeplearning.ai"
  lessons:
    - number: 1
      title: "后训练全景：从文本续写器到助手"
      url: "/course-notes/post-training-lecture-01/"
      description: "预训练与后训练的分工；SFT、DPO、在线 RL 的监督信号；如何在提示词、RAG 与参数训练之间做选择。"
    - number: 2
      title: "SFT 原理：示范数据、损失函数与 LoRA"
      url: "/course-notes/post-training-lecture-02/"
      description: "拆解条件概率、teacher forcing、回答区域的 loss mask、聊天模板与数据质量，并用矩阵维度理解 LoRA。"
    - number: 3
      title: "SFT 实践：搭建指令微调流水线"
      url: "/course-notes/post-training-lecture-03/"
      description: "整合已有 SFT 实践讲义，核对讲师数据和 checkpoint；从加载模型、整理数据到 SFTTrainer、保存与训练前后评估。"
    - number: 4
      title: "DPO 原理：从偏好对到直接优化"
      url: "/course-notes/post-training-lecture-04/"
      description: "从 KL 正则目标与 Bradley–Terry 模型推导 DPO；理解 reference、beta、相对概率和离线数据的局限。"
    - number: 5
      title: "DPO 实践：让助手学会新的自称"
      url: "/course-notes/post-training-lecture-05/"
      description: "查看真实 chosen / rejected 数据，以 Qwen → Deep Qwen 为例讲清偏好构造、DPOTrainer、指标与泛化检查。"
    - number: 6
      title: "在线 RL 原理：奖励、PPO 与 GRPO"
      url: "/course-notes/post-training-lecture-06/"
      description: "沿着采样—评分—更新理解策略梯度；区分旧策略与参考策略，推导 PPO 裁剪目标与 GRPO 组内优势。"
    - number: 7
      title: "GRPO 实践与全课复习：让数学答案可验证"
      url: "/course-notes/post-training-lecture-07/"
      description: "构建可验证奖励和最小 GRPO 流程，排查零优势、奖励投机与长度问题；附三种方法选型表、术语速查及自测答案。"
- id: cs2680
  code: "CS2680"
  school: "Harvard University · 哈佛大学"
  title: "现代 AI 系统：智能体与系统优化"
  english_title: "Modern AI Systems: Agents and System Optimizations"
  description: "从智能体的使用、设计与评估，逐步深入大模型服务与系统优化。"
  url: "/course-notes/cs2680/"
  source_url: "https://cs2680.seas.harvard.edu/"
  source_domain: "cs2680.seas.harvard.edu"
  lessons:
    - number: 1
      title: "课程导论（Overview）"
      url: "/course-notes/cs2680-lecture-01/"
      description: "课程主线与整体脉络：从智能体循环到支撑它的服务栈，涵盖课程安排、智能体循环、记忆、核心工具、扩展机制、.claude 目录、MCP 深入与术语表。"
    - number: 2
      title: "从用户视角看智能体（一）：Claude Code 如何工作"
      url: "/course-notes/cs2680-lecture-02/"
      description: "以 Claude Code 为案例拆解对话框背后的智能体循环：上下文收集、动作生成、工具执行，以及跨会话记忆与 Skill / MCP / Hook / Plugin 四类扩展机制。"
    - number: 3
      title: "从用户视角看智能体（二）：多智能体与最佳实践"
      url: "/course-notes/cs2680-lecture-03/"
      description: "通过 Superpowers 与 Caveman 两个插件案例理解技能与钩子的设计，进而掌握并行智能体、子智能体、智能体团队与长时运行智能体，并理解编程 3.0 的不确定性本质与最佳实践。"
    - number: 4
      title: "智能体设计（一）：上下文管理与工具设计"
      url: "/course-notes/cs2680-lecture-04/"
      description: "从 ReAct 循环讲起，系统比较搜索/编辑/执行等工具的设计取舍，并深入上下文工程：有限资源、长度与位置代价、准入/卸载/转换/压缩四法、上下文失效模式，以及「智能体 = 模型 × 外壳」。"
    - number: 5
      title: "智能体设计（二）：多智能体系统"
      url: "/course-notes/cs2680-lecture-05/"
      description: "系统梳理八种多智能体架构（主管—工人、层级、流水线/DAG、黑板、委员会、市场、集群、动态拓扑）、任务分解的粒度与失效模式、通信的四个维度，以及 MCP 与 A2A 协议的定位与区别。"
    - number: 6
      title: "智能体设计（三）：记忆与可靠性"
      url: "/course-notes/cs2680-lecture-06/"
      description: "围绕记忆设计七问（写/编码/存储/检索/泛化/遗忘/归属）搭建智能体记忆体系，并用「错误会复合」的量化视角剖析任务规格、外壳、模型、工具、环境五层失效模式与各自的修复策略。"
- id: cs146s
  code: "CS146S"
  school: "Stanford University · 斯坦福大学"
  title: "现代软件开发者"
  english_title: "The Modern Software Developer"
  description: "围绕 AI 辅助开发、编码智能体与现代软件工程，学习从需求到交付的实践方法。"
  url: "/course-notes/cs146s/"
  source_url: "https://themodernsoftware.dev/"
  source_domain: "themodernsoftware.dev"
  lessons:
    - number: 1
      title: "导论与 LLM 原理"
      url: "/course-notes/cs146s-lecture-01/"
      description: "Stanford CS146S 开篇：为什么这是历史上软件开发者生产力最高的时代、课程的 takeaway 与后勤，以及面向工程师的「5 页讲清 LLM」——自回归、分词与嵌入、Transformer、三阶段训练、推理模型与能力边界。"
    - number: 2
      title: "高效提示工程（LLM Power Prompting）"
      url: "/course-notes/cs146s-lecture-02/"
      description: "系统讲解提示词技术：零样本、K-shot/上下文学习、思维链（多样本与零样本）、自洽性、工具使用、RAG、Reflexion，以及 system/user/assistant 三类消息与结构化、角色化、显式化的最佳实践。"
