<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafbfc">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% feed_meta %}{% seo %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/navigation.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/search.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/desktop.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/visit-stats.css' | relative_url }}">
  <script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']]},svg:{fontCache:'global'}};</script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
{% capture site_section %}{% include page-section.html %}{% endcapture %}
<body data-section="{{ site_section | strip }}">
  {% include site-header.html %}
  <main class="shell" id="main-content">{% include visit-stats.html %}{{ content }}</main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>© {{ 'now' | date: '%Y' }} Straight · 用文字整理思考。</p>
      <p><a href="{{ '/feed.xml' | relative_url }}">RSS</a> · Powered by GitHub Pages · <span class="site-count">浏览 <span data-visit-stat="site_pv">—</span> · 访客 <span data-visit-stat="site_uv">—</span></span></p>
    </div>
  </footer>
  <script defer src="{{ '/assets/js/visit-stats.js' | relative_url }}"></script>
</body>
</html>
