<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试经验 · Straight 的知识库</title>
<meta name="description" content="{{ page.description }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
<link rel="stylesheet" href="{{ '/assets/css/navigation.css' | relative_url }}">
<style>
:root{
  --bg:#f4f5f8; --card:#ffffff; --text:#1b1f27; --muted:#6b7280; --faint:#9ca3af;
  --primary:#4f46e5; --primary-soft:#eef2ff; --primary-text:#4338ca;
  --border:#e6e8ed; --border-strong:#d5d9e2;
  --amber:#d97706; --amber-soft:#fef3c7; --green:#059669; --green-soft:#d1fae5;
  --blue:#2563eb; --blue-soft:#dbeafe; --code-bg:#f2f3f6;
  --shadow:0 1px 2px rgba(20,24,40,.04),0 8px 24px rgba(20,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.7; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}
/* Keep site navigation and study modes visible as one sticky group. */
.study-navigation{position:sticky;top:0;z-index:20}
.study-header{background:rgba(244,245,248,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
}
.head-inner{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.3px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--primary);transform:rotate(45deg)}
.brand small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.head-spacer{flex:1}
.progress-mini{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pbar{width:120px;height:7px;background:var(--border);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#7c73e6);width:0;transition:width .4s}

.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px}
.tab{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:.15s}
.tab:hover{color:var(--text);background:var(--bg)}
.tab.on{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3)}

.hero{padding:32px 0 20px}
.hero h1{font-size:26px;letter-spacing:-.6px;font-weight:750;margin-bottom:6px}
.hero p{color:var(--muted);font-size:14px}
.kbd{display:inline-block;background:var(--card);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:11px;font-family:ui-monospace,monospace;color:var(--muted);margin:0 1px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--border);border-radius:11px;background:var(--card);font-size:14px;color:var(--text);outline:none}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.chip{padding:8px 13px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;transition:.15s}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-text);font-weight:600}
.chip .n{opacity:.6;margin-left:3px;font-size:11px}

/* ---------- 闪卡 ---------- */
.stage{display:flex;flex-direction:column;align-items:center}
.card-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:14px;min-height:28px}
.tag{font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.tag.topic{background:var(--primary-soft);border-color:transparent;color:var(--primary-text);font-weight:600}
.tag.freq-hi{background:var(--amber-soft);border-color:transparent;color:var(--amber);font-weight:600}
.tag.co{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.tag.st-new{background:var(--bg);color:var(--faint)}
.tag.st-fuzzy{background:var(--amber-soft);color:var(--amber)}
.tag.st-mastered{background:var(--green-soft);color:var(--green)}
.counter{font-size:12px;color:var(--faint);margin-left:4px}

.flash{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);overflow:hidden;transition:.2s;
}
.q-zone{padding:38px 40px 34px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.q-label{font-size:11px;letter-spacing:1.5px;color:var(--faint);text-transform:uppercase;margin-bottom:14px}
.q-text{font-size:20px;font-weight:650;line-height:1.55;letter-spacing:-.2px}
.reveal-btn{
  display:block;width:calc(100% - 32px);margin:0 16px 20px;padding:12px;border:none;
  border-radius:11px;background:var(--primary-soft);color:var(--primary-text);
  font-size:14px;font-weight:600;cursor:pointer;transition:.15s;
}
.reveal-btn:hover{background:#e3e8ff}
.ans-zone{border-top:1px solid var(--border);padding:26px 34px 30px;background:#fcfcfd;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ans-label{font-size:11px;letter-spacing:1.5px;color:var(--green);text-transform:uppercase;font-weight:700;margin-bottom:12px}
.answer{font-size:14.5px;line-height:1.85;color:#2b303b}
.answer strong{font-weight:700;color:#111827}
.answer code{background:var(--code-bg);padding:1px 5px;border-radius:5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#b3306b}
.answer ul,.answer ol{margin:8px 0 8px 4px;padding-left:20px}
.answer li{margin:4px 0}
.answer p{margin:8px 0}
.answer table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px}
.answer th,.answer td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
.answer th{background:var(--primary-soft);color:var(--primary-text);font-weight:600}

.grade-bar{display:flex;gap:10px;margin-top:18px;width:100%}
.grade{flex:1;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px}
.grade:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.grade.fuzzy{color:var(--amber)}.grade.fuzzy:hover{border-color:var(--amber);background:var(--amber-soft)}
.grade.ok{color:var(--green)}.grade.ok:hover{border-color:var(--green);background:var(--green-soft)}
.grade.next{color:var(--primary)}.grade.next:hover{border-color:var(--primary);background:var(--primary-soft)}
.grade .k{font-size:10px;opacity:.55;font-family:ui-monospace,monospace}
.nav-hint{text-align:center;color:var(--faint);font-size:11.5px;margin-top:14px}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-size:32px;margin-bottom:10px}

/* ---------- 浏览 ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden;transition:.15s}
.item:hover{border-color:var(--border-strong)}
.item-head{padding:16px 18px;display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.qnum{flex:none;width:30px;height:30px;border-radius:9px;background:var(--primary-soft);color:var(--primary-text);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.item-q{flex:1;font-weight:600;font-size:14.5px;line-height:1.5}
.item-q .tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.item .chev{color:var(--faint);transition:.2s;flex:none;margin-top:6px}
.item.open .chev{transform:rotate(180deg)}
.item-body{display:none;border-top:1px solid var(--border);padding:20px 22px;background:#fcfcfd}
.item.open .item-body{display:block;animation:fade .2s}
.mini-grade{display:flex;gap:8px;margin-top:18px}
.mini-grade button{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--muted)}
.mini-grade button.on{font-weight:700}
.mini-grade button.on.fuzzy{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.mini-grade button.on.mastered{background:var(--green-soft);border-color:var(--green);color:var(--green)}

.section-title{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:1px;text-transform:uppercase;margin:26px 0 10px;padding-left:2px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat .v{font-size:24px;font-weight:750;letter-spacing:-.5px}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.g .v{color:var(--green)}.stat.a .v{color:var(--amber)}.stat.p .v{color:var(--primary)}

.reset{font-size:12px;color:var(--faint);background:none;border:none;cursor:pointer;text-decoration:underline;padding:4px}
.reset:hover{color:var(--text)}
.hidden{display:none!important}
@media(max-width:640px){
  .q-zone{padding:28px 20px}.q-text{font-size:17px}
  .ans-zone{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:22px}.head-inner{gap:10px}.brand small{display:none}
}
</style>
</head>
<body>
<div class="study-navigation">
{% include site-header.html %}
<header class="study-header">
  <div class="head-inner">
    <div class="brand"><span class="dot"></span>面经速学卡 <small>大模型后训练</small></div>
    <div class="head-spacer"></div>
    <div class="progress-mini">
      <span>掌握 <b id="miniMastered">0</b>/<b id="miniTotal">0</b></span>
      <div class="pbar"><i id="miniBar"></i></div>

    <div class="tabs">
      <button class="tab on" data-mode="flash">闪卡</button>

    </div>
  </div>
</header>
</div>

<div class="wrap">
  <div class="hero" id="hero">
    <h1>把面经，变成记得住的东西</h1>
    <p>主动回忆 + 间隔重现。<span class="kbd">空格</span> 翻答案 · <span class="kbd">1</span> 模糊 · <span class="kbd">2</span> 掌握 · <span class="kbd">←</span><span class="kbd">→</span> 切题</p>
  </div>

  <div id="flashView" class="stage">
    <div class="stats" style="width:100%">
      <div class="stat"><div class="v" id="sTotal">0</div><div class="l">总题数</div></div>
      <div class="stat g"><div class="v" id="sMastered">0</div><div class="l">已掌握</div></div>
      <div class="stat a"><div class="v" id="sFuzzy">0</div><div class="l">待巩固</div></div>
      <div class="stat p"><div class="v" id="sRate">0%</div><div class="l">掌握率</div></div>
    </div>
    <div class="toolbar" style="width:100%">
      <div class="chip on" data-filter="all">全部題</div>
      <div class="chip" data-filter="高频">仅高频</div>
      <div class="chip" data-filter="fuzzy">仅待巩固</div>
      <div class="chip" data-filter="new">仅未学</div>
      <div style="flex:1"></div>
      <button class="reset" id="resetBtn">重置进度</button>
    </div>
    <div class="card-meta" id="cardMeta"></div>
    <div class="flash" id="flashCard">
      <div class="q-zone">
        <div class="q-label">Question</div>
        <div class="q-text" id="qText"></div>
      </div>
      <button class="reveal-btn" id="revealBtn">显示参考答案 · 空格</button>
      <div class="ans-zone hidden" id="ansZone">
        <div class="ans-label">参考答案</div>
        <div class="answer" id="ansText"></div>
      </div>
    </div>
    <div class="grade-bar" id="gradeBar" style="display:none">
      <button class="grade fuzzy" data-g="fuzzy"><span>再看一遍</span><span class="k">1</span></button>
      <button class="grade next" data-g="next"><span>下一题</span><span class="k">→</span></button>
      <button class="grade ok" data-g="mastered"><span>已掌握</span><span class="k">2</span></button>
    </div>
    <div class="nav-hint" id="navHint"></div>
  </div>

  <div id="browseView" class="hidden">
    <div class="toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="searchInput" placeholder="搜索题目或答案关键词，如 GRPO / LoRA / 去污…">
      </div>
    </div>
    <div id="topicChips" class="toolbar"></div>
    <div class="list" id="browseList"></div>
  </div>

  <div id="quizView" class="stage hidden">
    <div class="toolbar" style="width:100%;justify-content:center">
      <div class="chip on" id="quizStart">开始一次随机测验（10 题）</div>
    </div>
    <div id="quizArea" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
      <div class="card-meta" id="quizMeta"></div>
      <div class="flash" style="width:100%">
        <div class="q-zone"><div class="q-label" id="quizLabel">题目</div><div class="q-text" id="quizQ"></div></div>
        <button class="reveal-btn" id="quizReveal">显示答案</button>
        <div class="ans-zone hidden" id="quizAnsZone"><div class="ans-label">参考答案</div><div class="answer" id="quizAns"></div></div>
      </div>
      <div class="grade-bar" id="quizBar" style="display:none">
        <button class="grade next" id="quizNext">下一题 <span class="k">→</span></button>
      </div>
      <div class="nav-hint" id="quizHint"></div>
    </div>
  </div>
</div>

<script>
window.QUESTIONS = [
  {
    "id": 1,
    "topic": "对齐算法与RL",
    "company": [
      "字节",
      "阿里"
    ],
    "freq": "高频",
    "q": "为什么有了 SFT 之后还需要 RLHF？",
    "answer": "**核心：SFT 只能教模型「模仿正确答案」，无法表达「偏好」与「程度」。**\n\n- SFT 的目标是最大化标注答案的似然（负对数似然），它把每个样本当作唯一正确解。但真实场景中大量任务没有唯一答案，只有「更好 / 更差」的相对偏好。\n- SFT 存在** exposure bias**：训练时喂的是参考前缀，推理时模型看到的是自己生成的前缀，错误会累积。\n- 人类的真实诉求是多维的（有用、无害、诚实），难以用单一标准答案覆盖；RLHF 通过奖励信号直接优化「人类偏好」这一最终目标。\n- RLHF 能让模型学会**自我修正与取舍**：在多个可接受回答中偏向更安全、更符合意图的那个，这是判别式模仿做不到的。\n\n**一句话**：SFT 解决「会不会」，RLHF 解决「好不好、该不该」。工业界通常先 SFT 建立行为范式，再 RLHF 做偏好对齐。"
  },
  {
    "id": 2,
    "topic": "对齐算法与RL",
    "company": [
      "字节",
      "腾讯"
    ],
    "freq": "高频",
    "q": "PPO 和 DPO 的主要思想是什么？DPO 相比 PPO 做了哪些改进？还知道哪些 RL 算法？",
    "answer": "**PPO（近端策略优化）**：经典的 RLHF 第二阶段。先训练奖励模型（RM），再用 PPO 优化策略模型，通过 `ratio = π_new/π_old` 的裁剪（clip）把更新限制在信任域内，并用 KL 惩罚防止策略偏离参考模型。需要加载 4 个模型：策略、参考、奖励、价值（critic），显存与工程成本高。\n\n**DPO（直接偏好优化）**：跳过显式奖励模型和在线 RL。利用偏好对 `(chosen, rejected)`，把对齐变成一个简单的分类损失：\n\n`L_DPO = -E[ log σ( β·log(πθ(yw|x)/πref(yw|x)) − β·log(πθ(yl|x)/πref(yl|x)) ) ]`\n\n**DPO 相比 PPO 的改进**：\n\n1. **去掉奖励模型和价值模型**：不用训练 RM，也不用 actor-critic，显存从 4 个模型降到 2 个（策略 + 参考）。\n2. **去掉在线采样与 RL 循环**：离线偏好数据即可训练，稳定、简单、易调试。\n3. **训练稳定**：避免了 PPO 的策略梯度方差与环境交互不稳定问题。\n\n**代价**：DPO 依赖固定的离线偏好数据，是 off-policy 的，分布偏移后泛化不如在线方法（这也是高频追问点）。\n\n**其他 RL 算法**：GRPO（DeepSeek，去掉 critic，组内相对奖励）、RLOO、ReMax、KTO（无需配对偏好）、ORPO（SFT+偏好合一）、IPO、SimPO，以及 RLVR、DAPO、Agentic RL 等。"
  },
  {
    "id": 3,
    "topic": "对齐算法与RL",
    "company": [
      "阿里",
      "通义"
    ],
    "freq": "高频",
    "q": "对比 DPO、PPO、GRPO 的原理与区别，并写出 DPO 的 Loss 函数。",
    "answer": "**DPO Loss**：\n\n`L_DPO = -E_(x,yw,yl)[ log σ( β·log(πθ(yw|x)/πref(yw|x)) − β·log(πθ(yl|x)/πref(yl|x)) ) ]`\n\n其中 `yw` 为偏好回答、`yl` 为拒绝回答，`β` 控制与参考模型的偏离程度。\n\n**三者对比**：\n\n| 维度 | PPO | DPO | GRPO |\n|---|---|---|---|\n| 奖励来源 | 训练的奖励模型 | 隐式（偏好对） | 可验证规则 / 奖励函数 |\n| 价值模型 | 需要 critic | 不需要 | **不需要** |\n| 采样方式 | 在线 on-policy | 离线 off-policy | 在线，组内采样 |\n| 优势估计 | GAE + critic | 偏好差 | 组内奖励归一化（z-score） |\n| 显存 / 工程 | 最高 | 最低 | 中等 |\n| 稳定性 | 较差，需调参 | 好 | 较好 |\n\n**演进逻辑**：PPO 强但重 → DPO 轻但受限于离线数据 → GRPO 用「同一 prompt 采一组答案、组内相对比较」替代 critic，兼顾轻量与在线探索，成为推理模型（DeepSeek-R1）的主流选择。"
  },
  {
    "id": 4,
    "topic": "对齐算法与RL",
    "company": [
      "阿里"
    ],
    "freq": "中频",
    "q": "DPO 有个缺点，泛化能力不如在线方法，为什么？能结合实际例子说明吗？",
    "answer": "**根因：DPO 是 off-policy 的，训练数据固定，策略更新后会偏离数据分布。**\n\n- 偏好对由某个固定策略（如 SFT 模型）采样并标注。DPO 优化时，策略 πθ 不断变化，但数据始终是旧策略产生的，二者出现**分布偏移（distribution mismatch）**。\n- 模型可能对训练集中的偏好对越拟合越好，却没学到「什么样的回答更好」的泛化能力，尤其在分布外 prompt 上表现下降。\n- DPO 没有在线探索，无法发现并利用新策略下才出现的高质量回答。\n\n**例子**：用一批「短回答优于长回答」的偏好数据训练后，模型在相似问题上的确变简洁了；但遇到需要详细推理的新问题时，因为训练数据里没有这类偏好信号，它可能仍然给出过短、不完整的答案——而在线 RL 可以通过即时奖励在新问题上继续探索并纠正。\n\n**改进方向**：迭代式 / 在线 DPO（用当前策略重新采样偏好对）、on-policy 数据、结合 RLVR 或 DPO + RL 混合流程。"
  },
  {
    "id": 5,
    "topic": "对齐算法与RL",
    "company": [
      "阿里",

    "answer": "**KV Cache**：自回归生成时，历史 token 的 K、V 在后续每一步都要用。把它们缓存下来避免重复计算，把每步生成复杂度从 O(n²) 降到 O(n)。代价是显存随序列长度与并发数线性增长——这正是 GQA / MQA 要优化的对象。\n\n**GQA 思想**：见前文——Q 分组共享 K/V，在几乎不损效果的前提下大幅减小 KV Cache，缓解显存与带宽瓶颈。\n\n**FlashAttention 思想**：**IO 感知**的精确注意力算法。注意力的瓶颈不在计算而在 GPU 显存（HBM）与片上 SRAM 之间的数据搬运。FlashAttention 通过：\n\n1. **分块（tiling）**：把 Q/K/V 切成小块，在 SRAM 中完成块内 attention 计算；\n2. **在线 softmax（online softmax）**：不用保存完整的 N×N 注意力矩阵，边算边累积归一化；\n3. **重计算**：反向传播时重算中间结果，用计算换显存。\n\n结果：显存从 O(n²) 降到 O(n)，且因为减少了 HBM 读写而更快，**数值上是精确 attention**（非近似）。\n\n**其他优化方法**：\n\n- 并行：数据并行、张量并行、流水线并行、序列并行、ZeRO/FSDP；\n- 系统：DeepSpeed、Megatron-LM、混合精度（BF16/FP16）、梯度检查点、算子融合；\n- 推理：vLLM 的 PagedAttention、连续批处理、量化（INT8/INT4）、投机解码、Prefix Caching。"

    "q": "LoRA 的原理是什么？A、B 矩阵如何初始化？秩（Rank）如何设置？",
    "answer": "**原理**：冻结预训练权重 `W₀`，用两个低秩矩阵的乘积近似权重更新：`W = W₀ + ΔW = W₀ + B·A`，其中 `A ∈ R^{r×k}`、`B ∈ R^{d×r}`，秩 `r ≪ min(d,k)`。只训练 A、B，参数量从数十亿降到数百万，大幅降低显存与训练成本，且可插拔、多任务切换方便。\n\n**初始化**：通常 **A 用高斯随机初始化，B 初始化为零矩阵**。这样训练开始时 `ΔW = B·A = 0`，模型行为与预训练模型完全一致，训练从恒等映射平稳起步，避免一开始就破坏原模型。（若两者都随机初始化，第一步就会引入大扰动，训练不稳。）\n\n**秩 r 的设置**：\n\n- r 越小，参数越少、越省显存，但表达能力有限；r 越大越接近全参数微调，成本越高。\n- 经验值：简单风格/任务对齐 r=8~16 往往够用；复杂任务或大数据可取 32~64 甚至更高。\n- `alpha`（缩放系数）常设为 r 的 1~2 倍，`alpha/r` 作为缩放因子调节更新强度。\n- 选择原则：从保守值（如 8/16）起步，用验证集效果决定是否增大；过拟合时减小 r 或增大 dropout。\n\n**变体**：QLoRA（在 4-bit 量化底座上做 LoRA，单卡可训大模型）、DoRA（权重分解+方向幅度解耦，质量更高）、AdaLoRA（动态分配秩）。"

    "answer": "**ZeRO（Zero Redundancy Optimizer）** 的核心是**消除数据并行中的冗余副本**——传统数据并行每个 GPU 都保存完整的模型参数、梯度、优化器状态，造成巨大显存浪费。ZeRO 把它们分片存储：\n\n- **ZeRO-1**：切分**优化器状态**（如 Adam 的一阶、二阶动量）。每个 GPU 只保存一部分优化器状态。\n- **ZeRO-2**：在 ZeRO-1 基础上，再切分**梯度**。\n- **ZeRO-3**：在 ZeRO-2 基础上，再切分**模型参数本身**。参数按需 from all-gather 获取，显存节省最彻底，可训练超大模型，但通信开销也最大。\n\n**记忆口诀**：1 切优化器状态，2 再加梯度，3 连参数一起切。\n\n**补充**：ZeRO-Offload 把优化器状态/参数卸载到 CPU/NVMe；ZeRO-Infinity 进一步支持异构存储。面试中常接着问「通信量与显存节省的权衡」——切得越多越省显存但通信越重，需结合带宽（如 NVLink/InfiniBand）选择。"

    "answer": "**BM25** 是信息检索中经典的**相关性打分函数**，用于衡量查询 q 与文档 d 的相关性，是稀疏检索（关键词检索）的代表，也是 RAG 召回阶段常用方法。\n\n**核心思想**：基于词频（TF）与逆文档频率（IDF），并加入文档长度归一化，相比早期 TF-IDF 更鲁棒。\n\n**打分公式**：\n\n`score(q,d) = Σ_{t∈q} IDF(t) · [ f(t,d)·(k₁+1) / ( f(t,d) + k₁·(1−b + b·|d|/avgdl) ) ]`\n\n- `f(t,d)`：词 t 在文档 d 中的词频；\n- `IDF(t)`：逆文档频率，越罕见的词权重越高；\n- `|d|` / `avgdl`：文档长度 / 平均文档长度，做长度归一化；\n- `k₁`、`b`：调节参数（常取 k₁≈1.2，b≈0.75）。\n\n**特性**：词频带来收益但**边际递减**（通过 k₁ 饱和），过长文档被惩罚（b 控制）。\n\n**面试关联**：常与向量检索对比——BM25 是稀疏、精确匹配、可解释、无需训练；向量检索是稠密语义匹配。现代检索系统多用**混合检索（BM25 + 向量）+ 重排**以取长补短。"

/* ---------- 轻量 Markdown 渲染 ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
          .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function mdRender(src){
  const lines=(src||'').split('\n'); const out=[]; let i=0;
  while(i<lines.length){
    let ln=lines[i];
    // 表格
    if(/^\s*\|/.test(ln)){
      const rows=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){rows.push(lines[i].trim());i++;}
      const cells=rows.map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
      if(cells.length>=2 && /^[\s:|-]+$/.test(rows[1])){
        const head=cells[0], body=cells.slice(2);
        out.push('<table><thead><tr>'+head.map(h=>'<th>'+inline(esc(h))+'</th>').join('')+'</tr></thead><tbody>');
        body.forEach(r=>out.push('<tr>'+r.map(c=>'<td>'+inline(esc(c))+'</td>').join('')+'</tr>'));
        out.push('</tbody></table>');
      } else {
        out.push('<p>'+rows.map(r=>inline(esc(r))).join('<br>')+'</p>');
      }
      continue;
    }
    // 无序列表
    if(/^\s*-\s+/.test(ln)){
      const items=[];
      while(i<lines.length && /^\s*-\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*-\s+/,''));i++;}
      out.push('<ul>'+items.map(t=>'<li>'+inline(esc(t))+'</li>').join('')+'</ul>');continue;
    }
    // 有序列表
    if(/^\s*\d+\.\s+/.test(ln)){
      const items=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*\d+\.\s+/,''));i++;}
      out.push('<ol>'+items.map(t=>'<li>'+inline(esc(t))+'</li>').join('')+'</ol>');continue;
    }
    if(ln.trim()===''){i++;continue;}
    // 连续普通行合并为段落
    const para=[];
    while(i<lines.length && lines[i].trim()!=='' && !/^\s*\|/.test(lines[i]) && !/^\s*-\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])){
      para.push(lines[i].trim());i++;
    }
    out.push('<p>'+inline(esc(para.join(' ')))+'</p>');
  }
  return out.join('');
}

/* ---------- 状态 ---------- */
const Q = window.QUESTIONS || [];
const KEY='mianti_flash_state_v1';
let state={};
try{ state=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ state={}; }
function st(id){return state[id]||'new';}
function save(id,v){state[id]=v;localStorage.setItem(KEY,JSON.stringify(state));updateStats();}
function updateStats(){
  const m=Object.values(state).filter(v=>v==='mastered').length;
  const f=Object.values(state).filter(v=>v==='fuzzy').length;
  document.getElementById('miniMastered').textContent=m;
  document.getElementById('miniTotal').textContent=Q.length;
  document.getElementById('miniBar').style.width=(Q.length?m/Q.length*100:0)+'%';
  document.getElementById('sTotal').textContent=Q.length;
  document.getElementById('sMastered').textContent=m;
  document.getElementById('sFuzzy').textContent=f;
  document.getElementById('sRate').textContent=(Q.length?Math.round(m/Q.length*100):0)+'%';
}

/* ---------- 闪卡 ---------- */
let filter='all';
let deck=[], pos=0, revealed=false;
function tagHTML(q){
  let h='<span class="tag topic">'+q.topic+'</span>';
  q.company.forEach(c=>h+='<span class="tag co">'+c+'</span>');
  if(q.freq==='高频')h+='<span class="tag freq-hi">高频</span>';
  const s=st(q.id); const sm={new:'未学',fuzzy:'待巩固',mastered:'已掌握'};
  h+='<span class="tag st-'+s+'">'+sm[s]+'</span>';
  return h;
}
function buildDeck(){
  let arr=Q.slice();
  if(filter==='高频')arr=arr.filter(q=>q.freq==='高频');
  else if(filter==='fuzzy')arr=arr.filter(q=>st(q.id)==='fuzzy');
  else if(filter==='new')arr=arr.filter(q=>st(q.id)==='new');
  // 未掌握优先、模糊次之，高频优先，其余保持原序
  const rank=q=>(st(q.id)==='new'?0:st(q.id)==='fuzzy'?1:2);
  arr.sort((a,b)=>rank(a)-rank(b) || (b.freq==='高频')-(a.freq==='高频'));
  deck=arr; pos=0; showCard();
}
function showCard(){
  const hint=document.getElementById('navHint');
  if(!deck.length){
    document.getElementById('flashCard').classList.add('hidden');
    document.getElementById('gradeBar').style.display='none';
    document.getElementById('cardMeta').innerHTML='';
    document.getElementById('qText').textContent='';
    hint.innerHTML='<div class="empty"><div class="big">✓</div>这个筛选下没有题目了，换个筛选试试</div>';
    return;
  }
  document.getElementById('flashCard').classList.remove('hidden');
  if(pos>=deck.length){pos=0;}
  const q=deck[pos]; revealed=false;
  document.getElementById('cardMeta').innerHTML=tagHTML(q)+'<span class="counter">'+(pos+1)+' / '+deck.length+'</span>';
  document.getElementById('qText').textContent=q.q;
  document.getElementById('ansText').innerHTML=mdRender(q.answer);
  document.getElementById('ansZone').classList.add('hidden');
  document.getElementById('revealBtn').classList.remove('hidden');
  document.getElementById('gradeBar').style.display='none';
  hint.textContent='先自己想 10 秒，再翻答案 —— 主动回忆才记得住';
}
function reveal(){
  if(!deck.length)return;
  revealed=true;
  document.getElementById('ansZone').classList.remove('hidden');
  document.getElementById('revealBtn').classList.add('hidden');
  document.getElementById('gradeBar').style.display='flex';
  document.getElementById('navHint').textContent='对照答案后诚实自评，效果最好';
}
function grade(g){
  if(!deck.length)return;
  const q=deck[pos];
  if(g==='fuzzy'){ save(q.id,'fuzzy'); const rest=deck.slice(); rest.splice(pos,1); rest.push(q); deck=rest; if(pos>=deck.length)pos=0; showCard(); }
  else if(g==='mastered'){ save(q.id,'mastered'); next(); }
  else next();
}
function next(){ if(!deck.length)return; pos=(pos+1)%deck.length; showCard(); }
function prev(){ if(!deck.length)return; pos=(pos-1+deck.length)%deck.length; showCard(); }

/* ---------- 浏览 ---------- */
let activeTopic='全部', keyword='';
function renderTopicChips(){
  const topics=['全部']; Q.forEach(q=>{if(!topics.includes(q.topic))topics.push(q.topic)});
  document.getElementById('topicChips').innerHTML=topics.map(t=>{
    const n=t==='全部'?Q.length:Q.filter(q=>q.topic===t).length;
    return '<div class="chip'+(t===activeTopic?' on':'')+'" data-topic="'+t+'">'+t+'<span class="n">'+n+'</span></div>';
  }).join('');
  document.querySelectorAll('#topicChips .chip').forEach(el=>el.onclick=()=>{activeTopic=el.dataset.topic;renderTopicChips();renderList()});
}
function renderList(){
  const kw=keyword.trim().toLowerCase();
  let arr=Q.filter(q=>(activeTopic==='全部'||q.topic===activeTopic) &&
    (!kw || q.q.toLowerCase().includes(kw) || q.answer.toLowerCase().includes(kw)));
  const box=document.getElementById('browseList');
  if(!arr.length){box.innerHTML='<div class="empty">没有匹配的题目</div>';return;}
  const groups={}; arr.forEach(q=>{(groups[q.topic]=groups[q.topic]||[]).push(q)});
  let html='';
  Object.keys(groups).forEach(t=>{
    html+='<div class="section-title">'+t+' · '+groups[t].length+' 题</div>';
    groups[t].forEach(q=>{
      const s=st(q.id);
      html+='<div class="item" data-id="'+q.id+'"><div class="item-head"><div class="qnum">'+q.id+'</div>'+
        '<div class="item-q">'+esc(q.q)+'<div class="tags">'+tagHTML(q)+'</div></div>'+
        '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>'+
        '<div class="item-body"><div class="answer">'+mdRender(q.answer)+'</div>'+
        '<div class="mini-grade">'+
          '<button data-mg="new" class="'+(s==='new'?'on':'')+'">未学</button>'+
          '<button data-mg="fuzzy" class="'+(s==='fuzzy'?'on':'')+'">待巩固</button>'+
          '<button data-mg="mastered" class="'+(s==='mastered'?'on':'')+'">已掌握</button>'+
        '</div></div></div>';
    });
  });
  box.innerHTML=html;
  box.querySelectorAll('.item-head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));
  box.querySelectorAll('.mini-grade button').forEach(b=>b.onclick=()=>{
    const id=+b.closest('.item').dataset.id; save(id,b.dataset.mg); renderList();
  });
}

/* ---------- 测验 ---------- */
let quiz=[],qpos=0,qshow=false;
function startQuiz(){
  const pool=Q.slice().sort(()=>Math.random()-.5).slice(0,10);
  quiz=pool;qpos=0;
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('quizStart').textContent='重新测验（10 题）';
  showQuiz();
}
function showQuiz(){
  if(qpos>=quiz.length){
    document.getElementById('quizQ').textContent='测验完成 🎉';
    document.getElementById('quizMeta').innerHTML='';
    document.getElementById('quizLabel').textContent='DONE';
    document.getElementById('quizAnsZone').classList.add('hidden');
    document.getElementById('quizReveal').classList.add('hidden');
    document.getElementById('quizBar').style.display='none';
    document.getElementById('quizHint').textContent='共完成 '+quiz.length+' 题，可在闪卡模式继续巩固薄弱项';
    return;
  }
  const q=quiz[qpos];qshow=false;
  document.getElementById('quizMeta').innerHTML=tagHTML(q)+'<span class="counter">'+(qpos+1)+' / '+quiz.length+'</span>';
  document.getElementById('quizLabel').textContent='题目 '+(qpos+1);
  document.getElementById('quizQ').textContent=q.q;
  document.getElementById('quizAns').innerHTML=mdRender(q.answer);
  document.getElementById('quizAnsZone').classList.add('hidden');
  document.getElementById('quizReveal').classList.remove('hidden');
  document.getElementById('quizBar').style.display='none';
  document.getElementById('quizHint').textContent='先在心里作答，再揭晓';
}
function quizReveal(){
  qshow=true;
  document.getElementById('quizAnsZone').classList.remove('hidden');
  document.getElementById('quizReveal').classList.add('hidden');
  document.getElementById('quizBar').style.display='flex';
  document.getElementById('quizHint').textContent='';
}
function quizNext(){ if(!qshow){quizReveal();return;} qpos++;showQuiz(); }

/* ---------- 模式切换 & 事件 ---------- */
function setMode(m){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===m));
  document.getElementById('flashView').classList.toggle('hidden',m!=='flash');
  document.getElementById('browseView').classList.toggle('hidden',m!=='browse');
  document.getElementById('quizView').classList.toggle('hidden',m!=='quiz');
  document.getElementById('hero').classList.toggle('hidden',m!=='flash');
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));
document.querySelectorAll('.chip[data-filter]').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip[data-filter]').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); filter=c.dataset.filter; buildDeck();
});
document.getElementById('revealBtn').onclick=reveal;
document.getElementById('gradeBar').querySelectorAll('.grade').forEach(b=>b.onclick=()=>grade(b.dataset.g));
document.getElementById('searchInput').oninput=e=>{keyword=e.target.value;renderList()};
document.getElementById('quizStart').onclick=startQuiz;
document.getElementById('quizReveal').onclick=quizReveal;
document.getElementById('quizNext').onclick=quizNext;
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('确定清空所有掌握进度吗？')){state={};localStorage.setItem(KEY,'{}');updateStats();buildDeck();renderList();}
};
document.addEventListener('keydown',e=>{
  const mode=document.querySelector('.tab.on').dataset.mode;
  if(document.activeElement.tagName==='INPUT')return;
  if(mode==='flash'){
    if(e.code==='Space'){e.preventDefault();revealed?null:reveal();}
    else if(e.key==='ArrowRight'){e.preventDefault();next();}
    else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
    else if(e.key==='1'&&revealed){grade('fuzzy');}
    else if(e.key==='2'&&revealed){grade('mastered');}
  } else if(mode==='quiz'){
    if(e.code==='Space'){e.preventDefault();qshow?null:quizReveal();}
    else if(e.key==='ArrowRight'){e.preventDefault();quizNext();}
  }
});

/* ---------- init ---------- */
updateStats(); renderTopicChips(); renderList(); buildDeck();
</script>
